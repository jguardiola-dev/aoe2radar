# Lo rellena Maven al compilar (recurso filtrado, ver <resources> en pom.xml). La única fuente es el
# <version> del pom: no escribas aquí números a mano. Lo lee util.Identidad al cargar la clase.
# version.pom: el <version> del pom tal cual (p. ej. 1.3.0).
# version.app: la que enseña la app y compara con los tags vX.Y de GitHub (1.3.0 -> 1.3); la calcula
#              build-helper (regex-property, en el pom) y es también la de jpackage (--app-version).
version.pom=${project.version}
version.app=${version.app}
